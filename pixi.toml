[workspace]
name = "walkie-ros"
channels = ["https://prefix.dev/robostack-jazzy", "https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

[dependencies]
# RoboStack build set _25. Every build set rebuilds all ROS packages, so the
# mutex is pinned: adding or updating a package must not silently move the
# environment to another set. Changing it requires `pixi run clean && pixi run build`.
# See docs/migrations/04-robostack-build-25.md.
ros2-distro-mutex = "0.19.*"

# Base ROS dependencies
ros-jazzy-ros-base = "*"
pkg-config = "*"
compilers = ">=1,<2"
gcc_linux-64 = ">=13,<14"
gxx_linux-64 = ">=13,<14"
make = "*"
ninja = "*"
ros-jazzy-ros2cli = "*"

# Build tools
colcon-common-extensions = "*"
cmake = "<4"
kernel-headers_linux-64 = ">=5.14"

# Workspace dependencies
assimp = "*"
benchmark = "*"
bullet = "*"
bzip2 = "*"
ceres-solver = "*"
