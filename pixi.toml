[tasks]
setup = {cmd = "ln -sf libpthread.so.0 $CONDA_PREFIX/x86_64-conda-linux-gnu/sysroot/usr/lib/libpthread.so", description = "Fix missing libpthread.so symlink in conda sysroot"}
import = {cmd = "vcs import < walkie_external.repos", description = "Clone/update external repos defined in walkie_external.repos"}
build = {cmd = "colcon build --symlink-install --packages-ignore openarm_hardware --cmake-args -DCMAKE_PREFIX_PATH=$CONDA_PREFIX", depends-on = ["setup", "import"], description = "Build the ROS workspace ignoring physical CAN hardware"}
build-pkg = {cmd = "colcon build --symlink-install --cmake-args -DCMAKE_PREFIX_PATH=$CONDA_PREFIX --packages-select", depends-on = ["setup"], description = "Build a specific package, e.g: pixi run build-pkg -- openvdb_vendor"}
test = {cmd = "colcon test", description = "Run tests for the workspace"}
clean = {cmd = "rm -rf build install log", description = "Clean build artifacts (build, install, log directories)"}
mjcf = {cmd = "python description/scripts/build_mjcf.py", description = "Regenerate the MuJoCo model description/mujoco/walkie.xml from the robot xacro (no build needed)"}
mjcf-view = {cmd = "python -c \"import mujoco, mujoco.viewer; m = mujoco.MjModel.from_xml_path('description/mujoco/scene.xml'); d = mujoco.MjData(m); mujoco.mj_resetDataKeyframe(m, d, m.key('home').id); mujoco.viewer.launch(m, d)\"", description = "Open the MuJoCo scene (robot on a floor) in the interactive viewer, starting from the home keyframe"}
sim = {cmd = "env -u PYTHONPATH ROS_DISTRO=jazzy RMW_IMPLEMENTATION=rmw_fastrtps_cpp LD_LIBRARY_PATH=/home/kay/IsaacLab/.venv/lib/python3.12/site-packages/isaacsim/exts/isaacsim.ros2.core/jazzy/lib:$LD_LIBRARY_PATH /home/kay/IsaacLab/.venv/bin/python walkie-isaac/launch_sim.py", description = "Launch Isaac Sim Walkie Bot simulation with automated ROS 2 bridge (Jazzy)"}
teleop = {cmd = "ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -p use_sim_time:=true", description = "Teleoperate Walkie Bot base with sim time enabled"}
topics = {cmd = "ros2 topic list", description = "List active ROS 2 topics"}
rviz = {cmd = "ros2 run rviz2 rviz2 --ros-args -p use_sim_time:=true", description = "Launch RViz2 with simulation time enabled"}
rviz-scan = {cmd = "ros2 run rviz2 rviz2 -d walkie-isaac/config/view_scan.rviz --ros-args -p use_sim_time:=true", description = "Launch RViz2 pre-configured for Walkie Bot LiDAR scan"}

[tasks.build-setup]
args = [{ arg = "workers", default = "1" }]
cmd = "colcon build --symlink-install --parallel-workers {{ workers }} --cmake-args -DCMAKE_PREFIX_PATH=$CONDA_PREFIX"
depends-on = ["setup", "import"]
description = "Build workspace for initial setup (default: 1 worker; e.g. pixi run build-setup 3)"

# Scripts to source on environment activation, found after first colcon build.
[activation]
scripts = ["install/setup.bash"]

# Documentation site (MkDocs Material). The docs environment excludes the default
# feature, so it installs without ROS: pixi run docs / pixi run docs-build.
[feature.docs.dependencies]
mkdocs-material = ">=9.7,<10"
# MkDocs 2 is incompatible with the Material theme.
mkdocs = ">=1.6,<2"

[feature.docs.tasks]
docs = {cmd = "mkdocs serve", description = "Preview the documentation site at http://127.0.0.1:8000"}
docs-build = {cmd = "mkdocs build --strict", description = "Build the documentation site into site/, failing on any warning"}

[environments]
docs = {features = ["docs"], no-default-feature = true}
