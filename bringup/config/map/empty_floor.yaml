# Blank 20 m x 20 m map centered on the MuJoCo world origin, for Nav2 on the
# default MuJoCo scene, which has only a floor (nav_mujoco_omnibot.launch.py).
# Every cell is free; empty_floor.pgm is 400 x 400 pixels of value 254.
image: empty_floor.pgm
mode: trinary
resolution: 0.05
origin: [-10.0, -10.0, 0.0]
negate: 0
occupied_thresh: 0.65
free_thresh: 0.25
